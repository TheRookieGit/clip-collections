<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Collections">
<meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<title>News Collections</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{color-scheme:light dark;--paper:#f5f0e6;--sheet:#faf6ee;--hover:#f0eadd;--ink:#221e18;--soft:#6d665a;--faint:#8f8778;--line:#dad2c2;--strong:#221e18;--seal:#b23a2a;--on-seal:#fbf6ea;--ochre:#96660f;--notice:#f0e4ce;
--serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;--sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#1b1916;--sheet:#211f1b;--hover:#26231f;--ink:#ece5d8;--soft:#a49c8e;--faint:#7d766a;--line:#38342d;--strong:#cfc8ba;--seal:#e2694f;--on-seal:#1b1916;--ochre:#dda94f;--notice:#332b1e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{background:none;border:0;border-radius:0;outline:0}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:0}
.wrap{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
header{padding-bottom:8px;border-bottom:3px double var(--strong);display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px}
h1{font:900 clamp(26px,7.5vw,34px)/1.2 var(--serif);margin:0}
.date{font:14px var(--serif);text-align:right}
#mac{display:block;font:12px var(--sans);color:var(--soft)}
.add{padding:12px 0 10px;border-bottom:1px solid var(--line)}
.add.drag{background:var(--notice)}
.row{display:flex;gap:10px;align-items:center}
#link{flex:1;min-width:0;padding:8px 0;font-size:16px}
#link::placeholder,#q::placeholder{color:var(--faint)}
.btn{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:2px;background:none;cursor:pointer;white-space:nowrap;font-size:14px}
.btn.main{background:var(--seal);border-color:var(--seal);color:var(--on-seal);font:700 15px var(--serif);letter-spacing:.08em}
.btn.quiet{border:0;padding:0;min-height:44px;color:var(--soft)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--soft)}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.tray:empty{display:none}
.tray figure{position:relative;margin:0}.tray img{width:60px;height:78px;object-fit:cover;display:block;border:1px solid var(--line)}
.tray button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border:0;background:var(--strong);color:var(--paper);cursor:pointer;line-height:1;padding:0}
.filters{display:flex;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
#topics{flex:1;min-width:0;display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}#topics::-webkit-scrollbar{display:none}
#topics button{all:unset;cursor:pointer;font:15px var(--serif);color:var(--soft);white-space:nowrap;padding:6px 0}
#topics button[aria-pressed=true]{color:var(--seal);font-weight:700}
#topics button:focus-visible{outline:2px solid var(--seal)}
#q{width:88px;font-size:16px;text-align:right}
.day{font:700 13px var(--serif);letter-spacing:.06em;color:var(--soft);margin:20px 0 4px}
.item{border-bottom:1px solid var(--line)}
.item>button{all:unset;display:grid;grid-template-columns:1fr auto;gap:4px 14px;width:100%;box-sizing:border-box;padding:12px 0;cursor:pointer}
.item>button:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
@media (hover:hover){.item>button:hover{background:var(--hover)}}
.title{font:700 17px/1.5 var(--serif);overflow-wrap:anywhere}
.title.bare{font:14px/1.5 var(--sans);color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.meta{grid-column:1;font-size:12.5px;color:var(--soft)}
.stamp{grid-column:2;grid-row:1;align-self:start;margin-top:3px;font:700 12px/1.4 var(--serif);letter-spacing:.06em;padding:1px 6px;border:1px solid;border-radius:2px;white-space:nowrap}
.pending{color:var(--faint);border-style:dashed}.processing{color:var(--soft)}.saved{color:var(--seal);border-width:1.5px;transform:rotate(-3deg)}.incomplete{color:var(--ochre)}.failed{color:var(--paper);background:var(--strong);border-color:var(--strong)}
.detail{padding:2px 0 16px}
.detail p{margin:0 0 10px;font-size:14px;overflow-wrap:anywhere}
.detail a{color:var(--seal)}
.reason{background:var(--notice);padding:8px 12px}
.shots{display:flex;flex-direction:column;gap:8px;margin:10px 0}.shots img{width:100%;display:block;border:1px solid var(--line)}
.detail label{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font:700 13px var(--serif);color:var(--soft)}
.detail input,.detail textarea{width:100%;font:16px var(--sans);color:var(--ink);resize:vertical;min-width:0}
.actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.empty{padding:32px 0;color:var(--soft)}.empty b{display:block;font:700 20px var(--serif);color:var(--ink);margin-bottom:6px}
#gate{max-width:360px;margin:20vh auto 0;padding:0 16px}
#gate h1{padding-bottom:8px;border-bottom:3px double var(--strong)}
#gate input{display:block;width:100%;padding:12px 0;border-bottom:1px solid var(--line);margin:12px 0 16px;font-size:16px}
#gate .btn{width:100%}
#err{color:var(--seal);font-size:14px;min-height:1.6em;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--strong);color:var(--paper);padding:8px 14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="gate" hidden>
  <h1>News Collections</h1>
  <form id="gateForm">
    <input id="pass" type="password" placeholder="口令" autocomplete="current-password" aria-label="口令">
    <button class="btn main" type="submit">进入</button>
    <div id="err" role="alert"></div>
  </form>
</main>
<div class="wrap" id="app" hidden>
  <header><h1>News Collections</h1><div class="date"><span id="today"></span><span id="mac"></span></div></header>
  <section class="add" id="addBox">
    <form class="row" id="addForm">
      <input id="link" type="url" inputmode="url" placeholder="粘贴新闻链接" aria-label="新闻链接" autocomplete="off">
      <button class="btn main" id="save" type="submit">剪存</button>
    </form>
    <div class="row">
      <button class="btn quiet" id="pick" type="button">选择截图</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <span class="hint">几张截图合成一则新闻</span>
    </div>
    <div class="tray" id="tray"></div>
  </section>
  <div class="filters">
    <div id="topics" role="group" aria-label="按主题筛选"></div>
    <input id="q" type="search" placeholder="搜索" aria-label="搜索">
  </div>
  <section id="list" aria-live="polite"></section>
</div>
<div id="toast" role="status"></div>

<script>
"use strict";
const DEFAULT_API = "https://gxhqguewzkvogtilfrbo.supabase.co/functions/v1/api";
const STATUS = { pending: "待保存", processing: "处理中", saved: "已保存", incomplete: "图片不全", failed: "失败" };
const MAX_SHOTS = 30, MAX_B64 = 7_500_000;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const uid = () => Date.now().toString(36) + Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => (b % 36).toString(36)).join("");
const localDay = (iso) => { const d = new Date(iso); if (isNaN(d)) return ""; const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const safeLink = (u) => /^https?:\/\//i.test(u || "") ? u : "";

let passcode = store.get("passcode") || "";
let newsItems = [], pending = [], mac = null, open = null, tray = [], urls = {}, timer = null, topic = "";

let toastTimer;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800); }

async function api(action, body = {}) {
  const r = await fetch(DEFAULT_API, { method: "POST", headers: { "content-type": "application/json", "x-passcode": passcode }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "出错了，请稍后再试"); e.status = r.status; throw e; }
  return j;
}

// The requests the Mac has not taken in yet, on top of what it last reported, so the page always shows the latest.
function merged() {
  const m = new Map(newsItems.map((c) => [c.id, c]));
  for (const p of pending) {
    if (p.op === "add") { if (!m.has(p.id)) m.set(p.id, { id: p.id, kind: p.kind, url: p.url || "", shots: p.shots || [], title: "", source: "", topic: "", note: "", reason: "", status: "pending", createdAt: p.createdAt }); }
    else if (p.op === "delete") m.delete(p.id);
    else if (m.has(p.id)) {
      const c = { ...m.get(p.id) };
      if (p.op === "retry") { c.status = "pending"; c.reason = ""; }
      else for (const k of ["title", "topic", "note"]) if (p[k] !== undefined) c[k] = p[k];
      m.set(p.id, c);
    }
  }
  return [...m.values()].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
}

function dayName(iso) {
  const d = new Date(iso); if (isNaN(d)) return "更早";
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((start(new Date()) - start(d)) / 86400000);
  if (days === 0) return "今天";
  if (days === 1) return "昨天";
  return d.getFullYear() === new Date().getFullYear() ? `${d.getMonth() + 1}月${d.getDate()}日` : `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

function macText() {
  if (!mac) return "";
  if (mac.online) return "Mac 在线";
  return mac.state === "sleeping" ? "Mac 已休眠，开机后处理" : mac.state === "quit" ? "Mac 应用已退出，打开后处理" : "Mac 离线，开机后处理";
}

function render() {
  $("#mac").textContent = macText();
  const all = merged();
  const topics = [...new Set(all.map((c) => c.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh"));
  if (topic && !topics.includes(topic)) topic = "";
  $("#topics").innerHTML = [["全部", ""], ...topics.map((t) => [t, t])].map(([n, v]) => `<button type="button" data-topic="${esc(v)}" aria-pressed="${topic === v}">${esc(n)}</button>`).join("");
  const q = $("#q").value.trim().toLowerCase();
  const shown = all.filter((c) => (!topic || c.topic === topic) && (!q || [c.title, c.source, c.url, c.topic, c.note].join(" ").toLowerCase().includes(q)));
  // Keeps what is being typed in an open item from being replaced by a refresh.
  if (document.activeElement?.closest?.(".detail")) return;
  let html = "", last = null;
  for (const c of shown) {
    const day = dayName(c.createdAt);
    if (day !== last) { html += `<h2 class="day">${esc(day)}</h2>`; last = day; }
    html += card(c);
  }
  $("#list").innerHTML = html || (all.length ? `<div class="empty">没有符合条件的新闻</div>` : `<div class="empty"><b>剪下第一则新闻</b>粘贴一个链接，或者选择截图。Mac 开机后会存成 PDF。</div>`);
  if (open) loadShots(all.find((c) => c.id === open));
}

function card(c) {
  const bare = !c.title;
  const title = c.title || (c.kind === "shots" ? `截图 ${c.shots?.length || ""} 张` : c.url) || "未命名";
  const date = c.publishedAt || localDay(c.createdAt);
  const isOpen = open === c.id;
  const link = safeLink(c.url);
  const meta = [c.topic, c.source, date, c.fullPage ? "整页版" : ""].filter(Boolean).join(" · ");
  return `<article class="item" data-id="${esc(c.id)}">
    <button type="button" data-act="toggle" aria-expanded="${isOpen}">
      <div class="title${bare ? " bare" : ""}">${esc(title)}</div>
      <span class="stamp ${esc(c.status)}">${esc(STATUS[c.status] || c.status)}</span>
      <div class="meta">${esc(meta)}</div>
    </button>
    ${isOpen ? `<div class="detail">
      ${c.reason ? `<p class="reason">${esc(c.reason)}</p>` : ""}
      ${c.videoMissing ? `<p class="reason">视频没有保存，只保留了封面和文字。</p>` : ""}
      ${link ? `<p><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">打开原链接</a></p>` : ""}
      ${c.shots?.length ? `<div class="shots" data-shots></div>` : ""}
      <label>标题<input data-f="title" value="${esc(c.title)}" maxlength="200"></label>
      <label>主题<input data-f="topic" value="${esc(c.topic)}" maxlength="40"></label>
      <label>备注<textarea data-f="note" rows="2" maxlength="2000">${esc(c.note)}</textarea></label>
      <div class="actions">
        <button class="btn" data-act="edit" type="button">保存修改</button>
        ${c.status === "failed" || c.status === "incomplete" ? `<button class="btn" data-act="retry" type="button">重试</button>` : ""}
        <button class="btn quiet" data-act="delete" type="button">删除</button>
      </div>
    </div>` : ""}
  </article>`;
}

async function loadShots(c) {
  const box = $("[data-shots]");
  if (!c || !box) return;
  const need = c.shots.filter((p) => !urls[p]);
  try {
    if (need.length) Object.assign(urls, (await api("shot_urls", { paths: need })).urls);
    box.innerHTML = c.shots.map((p) => urls[p] ? `<img src="${esc(urls[p])}" alt="截图" loading="lazy">` : "").join("");
  } catch (e) { box.textContent = "截图打不开：" + e.message; }
}

async function refresh() {
  try {
    const j = await api("news_get");
    newsItems = j.newsItems; pending = j.pending; mac = j.mac;
    render();
  } catch (e) {
    if (e.status === 401) signOut(); else $("#mac").textContent = "连不上云端";
  }
}

function signOut() { passcode = ""; store.del("passcode"); $("#app").hidden = true; $("#gate").hidden = false; clearInterval(timer); }
function enter() { $("#gate").hidden = true; $("#app").hidden = false; refresh(); clearInterval(timer); timer = setInterval(() => { if (!document.hidden) refresh(); }, 15000); }

async function send(patch) {
  const j = await api("news_edit", { patch });
  pending.push(j.patch); mac = j.mac; render();
}

// Long screenshots keep their full height: only the width limits the size, so the words stay readable.
async function compress(file) {
  const bmp = await createImageBitmap(file);
  const canvas = document.createElement("canvas");
  for (const [side, q] of [[1800, .86], [1500, .8], [1200, .72], [1000, .65]]) {
    const scale = Math.min(1, side / bmp.width, 12000 / bmp.height);
    canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
    canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const b64 = canvas.toDataURL("image/jpeg", q).split(",")[1];
    if (b64.length <= MAX_B64) return b64;
  }
  throw new Error("这张截图太大了");
}

function addFiles(files) {
  const imgs = [...files].filter((f) => f.type.startsWith("image/"));
  for (const f of imgs) { if (tray.length < MAX_SHOTS) tray.push({ file: f, url: URL.createObjectURL(f) }); }
  if (tray.length >= MAX_SHOTS) toast(`一条新闻最多 ${MAX_SHOTS} 张截图`);
  drawTray();
}
function drawTray() {
  $("#tray").innerHTML = tray.map((t, i) => `<figure><img src="${esc(t.url)}" alt="第 ${i + 1} 张"><button type="button" data-rm="${i}" aria-label="移除第 ${i + 1} 张">×</button></figure>`).join("");
  $("#pick").textContent = tray.length ? `再加截图（已选 ${tray.length} 张）` : "选择截图";
}

async function save() {
  const url = $("#link").value.trim();
  if (!url && !tray.length) { toast("先粘贴链接或选择截图"); return; }
  const btn = $("#save"); btn.disabled = true;
  try {
    const id = uid(), createdAt = new Date().toISOString();
    if (url) {
      if (!/^https?:\/\//i.test(url)) throw new Error("只支持 http/https 链接");
      await send({ op: "add", id, kind: "link", url, createdAt });
      $("#link").value = "";
    }
    if (tray.length) {
      const shotId = url ? uid() : id, paths = [];
      for (const [i, t] of tray.entries()) {
        btn.textContent = `上传 ${i + 1}/${tray.length}`;
        const path = `s/${shotId}/${i}.jpg`;
        await api("shot_upload", { path, jpeg: await compress(t.file) });
        paths.push(path);
      }
      await send({ op: "add", id: shotId, kind: "shots", shots: paths, createdAt });
      tray.forEach((t) => URL.revokeObjectURL(t.url)); tray = []; drawTray();
    }
    toast(mac?.online ? "已收下，Mac 正在处理" : "已收下，等 Mac 开机后处理");
  } catch (e) { toast(e.message); } finally { btn.disabled = false; btn.textContent = "剪存"; }
}

$("#gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  passcode = $("#pass").value.trim();
  $("#err").textContent = "";
  try { await api("ping"); store.set("passcode", passcode); $("#pass").value = ""; enter(); }
  catch (x) { passcode = ""; $("#err").textContent = x.message; }
});
$("#addForm").addEventListener("submit", (e) => { e.preventDefault(); save(); });
$("#pick").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
$("#tray").addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { const [t] = tray.splice(+b.dataset.rm, 1); URL.revokeObjectURL(t.url); drawTray(); } });
$("#q").addEventListener("input", render);
$("#topics").addEventListener("click", (e) => { const b = e.target.closest("[data-topic]"); if (b) { topic = b.dataset.topic; render(); } });
$("#today").textContent = new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
document.addEventListener("paste", (e) => { const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); addFiles(f); } });
const box = $("#addBox");
for (const t of ["dragenter", "dragover"]) box.addEventListener(t, (e) => { e.preventDefault(); box.classList.add("drag"); });
box.addEventListener("dragleave", () => box.classList.remove("drag"));
box.addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("drag"); addFiles(e.dataTransfer.files); });
$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const art = b.closest(".item"), id = art.dataset.id;
  try {
    if (b.dataset.act === "toggle") { open = open === id ? null : id; document.activeElement?.blur?.(); render(); return; }
    if (b.dataset.act === "retry") { await send({ op: "retry", id }); toast("已加入重试"); }
    if (b.dataset.act === "delete") {
      if (!confirm("删除这条新闻？桌面上的 PDF 不受影响。")) return;
      open = null; document.activeElement?.blur?.(); await send({ op: "delete", id }); toast("已删除");
    }
    if (b.dataset.act === "edit") {
      const patch = { op: "update", id };
      art.querySelectorAll("[data-f]").forEach((f) => { patch[f.dataset.f] = f.value; });
      document.activeElement?.blur?.(); await send(patch); toast("已保存修改");
    }
  } catch (x) { toast(x.message); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && passcode) refresh(); });

if (passcode) enter(); else $("#gate").hidden = false;
</script>
</body>
</html>
